log_level=4
xlog_level=4
stderror_enabled=yes
syslog_enabled=no
syslog_facility=LOG_LOCAL0

udp_workers=4

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"

loadmodule "tm.so"
modparam("tm", "fr_timeout", 3)
modparam("tm", "fr_inv_timeout", 30)
modparam("tm", "restart_fr_on_each_reply", 0)
modparam("tm", "onreply_avp_mode", 1)

loadmodule "rr.so"
modparam("rr", "append_fromtag", 0)

loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"

loadmodule "event_routing.so"

loadmodule "usrloc.so"
modparam("usrloc", "nat_bflag", "NAT")
modparam("usrloc", "working_mode_preset", "single-instance-no-db")

loadmodule "registrar.so"
modparam("registrar", "tcp_persistent_flag", "TCP_PERSISTENT")

loadmodule "mid_registrar.so"
modparam("mid_registrar", "mode", 1)
modparam("mid_registrar", "extra_contact_params_avp", "$avp(extra_ct_params)")
modparam("mid_registrar", "max_contacts", 1)
modparam("mid_registrar", "pn_enable", 1)
modparam("mid_registrar", "pn_providers", "fcm")
modparam("mid_registrar", "pn_refresh_timeout", 6)

loadmodule "proto_udp.so"

loadmodule "httpd.so"
modparam("httpd", "ip", "0.0.0.0")
loadmodule "mi_http.so"

route {
	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	if (has_totag()) {
		if (is_method("ACK") && t_check_trans()) {
			t_relay();
			exit;
		}

		if (!loose_route()) {
			send_reply(404, "Not here");
			exit;
		}

		route(relay);
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}

	t_check_trans();

	if (loose_route()) {
		if (!is_method("ACK"))
			send_reply(403, "Preload Route denied");
		exit;
	}

	if (!is_method("REGISTER|MESSAGE"))
		record_route();

	if (!is_myself("$rd")) {
		send_reply(403, "Relay Forbidden");
		exit;
	}

	if (is_method("REGISTER")) {
		if ($(ct.fields(uri){uri.params}{param.exist,pn-prid}))
			$avp(extra_ct_params) = ";" + $(ct.fields(uri){uri.params});

		mid_registrar_save("location",,, 86400);
		$var(save_rc) = $retcode;
		xlog("mid_registrar_save returned $var(save_rc) for $tu\n");

		if ($var(save_rc) == 1) {
			$du = "sip:10.52.0.3:5080";
			force_send_socket("udp:10.52.0.1:5060");
			if (!t_relay())
				send_reply(500, "Register Relay Error");
			exit;
		}

		if ($var(save_rc) == 2)
			exit;

		send_reply(500, "Register Save Error");
		exit;
	}

	if ($rU == NULL) {
		send_reply(484, "Address Incomplete");
		exit;
	}

	$var(lookup_rc) = mid_registrar_lookup("location");
	if ($var(lookup_rc) < 0) {
		t_reply(404, "Not Found");
		exit;
	}

	if ($var(lookup_rc) == 2) {
		xlog("PN sent for $ru; waiting for refresh timeout\n");
		exit;
	}

	route(relay);
}

route[relay] {
	if (is_method("INVITE")) {
		t_on_branch("per_branch_ops");
		t_on_reply("handle_nat");
		t_on_failure("missed_call");
	}

	if (!t_relay())
		send_reply(500, "Internal Error");

	exit;
}

branch_route[per_branch_ops] {
	xlog("new branch at $ru\n");
}

onreply_route[handle_nat] {
	xlog("incoming reply\n");
}

failure_route[missed_call] {
	if (t_was_cancelled())
		exit;
}
