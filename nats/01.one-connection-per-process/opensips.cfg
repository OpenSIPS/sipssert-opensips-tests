log_level=3
stderror_enabled=yes
udp_workers=4

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "signaling.so"
loadmodule "tm.so"
loadmodule "httpd.so"
modparam("httpd", "ip", "192.168.52.1")
loadmodule "mi_http.so"

/* three NATS modules, one connection pool (nats.so) */
loadmodule "nats.so"
loadmodule "event_nats.so"
modparam("event_nats", "nats_url", "nats://192.168.52.10:4222")
loadmodule "cachedb_nats.so"
modparam("cachedb_nats", "cachedb_url", "nats:loc://192.168.52.10:4222/")
modparam("cachedb_nats", "kv_replicas", 1)
loadmodule "nats_consumer.so"
modparam("nats_consumer", "nats_url", "nats://192.168.52.10:4222")

route {
	sl_send_reply(200, "OK");
	exit;
}
