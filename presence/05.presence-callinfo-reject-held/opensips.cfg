log_level=4
stderror_enabled=yes
udp_workers=2
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "sipmsgops.so"
loadmodule "db_sqlite.so"
loadmodule "dialog.so"
loadmodule "httpd.so"
loadmodule "mi_http.so"
loadmodule "presence.so"
modparam("presence", "db_url", "sqlite:///var/lib/opensips/db_sqlite/opensips.db")
modparam("presence", "clean_period", 1)
modparam("presence", "db_update_period", 1)
loadmodule "presence_callinfo.so"
modparam("presence_callinfo", "disable_dialog_support_for_sca", 0)

route {
    if (is_method("SUBSCRIBE")) {
        if (!t_newtran()) {
            sl_reply_error();
            exit;
        }
        handle_subscribe();
        exit;
    }
    if (has_totag()) {
        if (loose_route()) {
            t_relay();
            exit;
        }
        send_reply(404, "No route");
        exit;
    }
    if (is_method("INVITE")) {
        record_route();
        if (!sca_engage("A")) {
            send_reply(403, "SCA validation failed");
            exit;
        }
        t_relay();
        exit;
    }
    send_reply(405, "Method Not Allowed");
}
