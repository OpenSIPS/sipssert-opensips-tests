log_level=3
stderror_enabled=yes
udp_workers=2

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"

loadmodule "nats.so"
loadmodule "event_nats.so"
modparam("event_nats", "nats_url", "nats://192.168.52.10:4222")
loadmodule "nats_consumer.so"
modparam("nats_consumer", "bind",
	"id=jobs;stream=WORK;durable=jobs_worker;filter=work.jobs;ack_wait=30s")

route {
	exit;
}

/* a durable work queue: every job is fetched, its result published on
 * work.done, and acked */
timer_route[drain, 1] {
	$var(n) = 0;
	while ($var(n) < 20 && nats_fetch("jobs", 10)) {
		if (nats_publish("work.done", "done:$nats_data"))
			nats_ack();
		else
			nats_nak();
		$var(n) = $var(n) + 1;
	}
}
