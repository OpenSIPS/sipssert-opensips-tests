log_level=3
stderror_enabled=yes
udp_workers=2

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "signaling.so"
loadmodule "tm.so"

loadmodule "nats.so"
loadmodule "nats_consumer.so"
modparam("nats_consumer", "nats_url", "nats://192.168.52.10:4222")

route {
	/* ask a NATS service per request without blocking the worker;
	 * answer with what it said */
	async(nats_request("rpc.lookup", "user=$fU", 2000), on_reply);
}

route[on_reply] {
	if ($retcode == 1 && $nats_data == "allowed") {
		sl_send_reply(200, "OK");
		exit;
	}
	xlog("L_ERR", "rpc.lookup: rc=$retcode data=$nats_data\n");
	sl_send_reply(500, "No Lookup");
	exit;
}
