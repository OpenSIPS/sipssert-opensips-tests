
log_level = 4
xlog_level = 4
stderror_enabled = yes

udp_workers = 4

####### Modules Section ########

#set module path
mpath = "/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_tcp.so"
loadmodule "proto_udp.so"

#### SIGNALING module
loadmodule "signaling.so"

#### StateLess module
loadmodule "sl.so"

#### Transaction Module
loadmodule "tm.so"
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
modparam("tm", "restart_fr_on_each_reply", 0)
modparam("tm", "onreply_avp_mode", 1)
modparam("tm", "auto_100trying", 0)

#### SIP MSG OPerationS module
loadmodule "sipmsgops.so"

#### MAX ForWarD module
loadmodule "maxfwd.so"

loadmodule "topology_hiding.so"
modparam("topology_hiding", "th_internal_trusted_tag", "internal_th_socket")
modparam("topology_hiding", "th_external_socket_tag", "external_socket")
modparam("topology_hiding", "th_contact_encode_param_password", "thinfo:ToPoCtPaSS:L")
modparam("topology_hiding", "th_use_param", "thinfo")

socket = udp:203.0.100.10:5060 tag external_socket

socket = tcp:10.100.20.40:5062 tag internal_th_socket

route
{
  route(main);
  exit;
}

route[get_call_info] {
  if ($socket_in == "udp:203.0.100.10:5060") {
    setflag("INBOUND");
  } else {
    setflag("OUTBOUND");
  }
}

route[is_sequential] {
  if (!has_totag()) {
    return -1;
  } else {
    return 1;
  }
}

onreply_route[reply] {
  xlog("\n$mb");
}

route[outbound_socket_switch] {
  $socket_out = "udp:203.0.100.10:5060";
  seturi("sip:$rU@203.0.200.50:5060");
}

route[main] {
  t_newtran();
  t_on_reply("reply");

  route(get_call_info);

  if (!route(is_sequential)) {
    if (isflagset("OUTBOUND")) {
      route(outbound_socket_switch);
    }

    topology_hiding("U");
  } else {
    if (!topology_hiding_match()) {
      t_reply(500, "Error");
      exit;
    }
  }

  t_relay();
}