#
# GH-3902 rtp_relay -- SIP -> WebRTC transcoding proxy + rtp_relay_update.
# As 01/02 plus an mi_datagram socket so the test fires rtp_relay_update -- the
# node-failover path where OpenSIPS GENERATES the re-INVITE itself (what the
# maintainer asked about), re-anchoring the stored callee SDP. Affected OpenSIPS
# drops the callee WebRTC profile (UDP/TLS/RTP/SAVPF + ICE=force) on the re-anchor.
#
log_level=4
stderror_enabled=yes

udp_workers=4

socket=udp:192.168.52.1:5060

####### Modules #######
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "dialog.so"
loadmodule "rtpengine.so"
loadmodule "rtp_relay.so"
loadmodule "mi_datagram.so"

modparam("mi_datagram", "socket_name", "udp:192.168.52.1:8088")
modparam("rtpengine", "rtpengine_sock", "udp:192.168.52.4:22222")

####### Routing #######
route{
	if (!mf_process_maxfwd_header(10)) {
		sl_send_reply(483,"Too Many Hops");
		exit;
	}

	if (has_totag()) {
		if (loose_route()) {
			xlog("L_NOTICE","SEQ $rm cseq=$cs\n");
			t_relay();
			exit;
		}
		sl_send_reply(404,"Not here");
		exit;
	}

	if (is_method("CANCEL")) {
		t_relay();
		exit;
	}

	if (is_method("INVITE")) {
		xlog("L_NOTICE","INITIAL INVITE -- caller(RTP/AVP) leg + engage\n");
		create_dialog();

		$rtp_relay(flags) = "replace-origin replace-session-connection";
		$rtp_relay(type)  = "RTP/AVP";
		$rtp_relay(peer)  = "ICE=remove";

		rtp_relay_engage("rtpengine");
		record_route();
		$du = "sip:192.168.52.3:5080";
		t_on_branch("webrtc");
		t_relay();
		exit;
	}

	sl_send_reply(405,"Method Not Allowed");
}

branch_route[webrtc] {
	xlog("L_NOTICE","BRANCH webrtc -- provisioning callee WebRTC profile\n");
	$rtp_relay(flags) = "replace-origin replace-session-connection";
	$rtp_relay(type)  = "UDP/TLS/RTP/SAVPF";
	$rtp_relay(peer)  = "ICE=force rtcp-mux-require SDES-off";
}
