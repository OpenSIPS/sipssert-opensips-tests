---
# rtp_relay test-set defines. Extends the suite defaults with rtpengine and a
# capture/checker IP. Values are the suite-standard osbr0 subnet (192.168.52.0/24)
# with two free addresses allocated for this set:
#   .4  rtpengine (ng control on udp:22222)
#   .5  packet capture sidecar
network_range: 192.168.52.0/24
network_gateway: 192.168.52.254
network_range_osbr1: 10.52.0.0/24
network_gateway_osbr1: 10.52.0.254
#opensips_version: 4.1
# Uses the stock sipssert OpenSIPS image (config.yml falls back to
# ghcr.io/opensips/opensips:sipssert when opensips_image is undefined). That
# image MUST carry the rtp modules -- rtp_relay.so, rtpengine.so, mi_datagram.so
# -- which the stock build does not include yet; add them via the repo-root
# .opensips.modules list (see README, "Required image modules") so the
# docker-opensips build bakes them in. To run against a pre-built image that
# already has them, uncomment and set opensips_image below.
#opensips_image: ghcr.io/opensips/opensips:sipssert
opensips_ip: 192.168.52.1
opensips_ip_osbr1: 10.52.0.1
opensips_port: 5060
uac_port: 5040
uas_ip: 192.168.52.3
uas_ip_osbr1: 10.52.0.3
uas_port: 5080
mysql_ip: 192.168.52.2
mysql_root_host: 192.168.52.%
username: testing
password: T3st|n6
nonce: 035cf70b1c4fcf4731150330410151743443

# --- rtp_relay / rtpengine additions ---
rtpengine_ip: 192.168.52.4
rtpengine_ng_port: 22222
# rtpengine: the official Debian rtpengine-daemon package (sipwise upstream,
# userspace-only -- no kernel dkms) installed at container start on a pinned
# debian base; avoids depending on any third-party rtpengine image.
rtpengine_image: debian:trixie-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2

# packet-capture sidecar: runs with HOST networking (no bridge IP needed) and
# sniffs the osbr0 bridge device into a shared volume so the python checker can
# read the rtpengine ng stream after the call completes.
capture_image: nicolaka/netshoot

# image used to run the (pure-python, dependency-free) ng checker; the
# python-opensips image already ships python3 and is pulled by every test set
checker_image: ghcr.io/opensips/python-opensips
