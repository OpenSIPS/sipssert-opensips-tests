log_level=3
stderror_enabled=yes
udp_workers=2

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "signaling.so"

loadmodule "nats.so"
loadmodule "cachedb_nats.so"
modparam("cachedb_nats", "cachedb_url", "nats:loc://192.168.52.10:4222/")
modparam("cachedb_nats", "kv_bucket", "opensips")
modparam("cachedb_nats", "kv_replicas", 1)

route {
	/* a per-user policy kept in NATS KV decides the answer; the call is
	 * recorded back into the KV */
	$var(rc) = nats_kv_get("", "policy.$fU", $var(policy));
	if ($var(rc) != 1 || $var(policy) != "allowed") {
		xlog("L_ERR", "policy.$fU: $var(policy)\n");
		sl_send_reply(403, "Forbidden");
		exit;
	}
	$var(rc) = nats_kv_put("", "seen.$fU", "$ci");
	if ($var(rc) != 1)
		xlog("L_ERR", "nats_kv_put failed: $var(rc)\n");
	sl_send_reply(200, "OK");
	exit;
}
