log_level=3
stderror_enabled=yes
udp_workers=2

socket=bin:192.168.52.1:5566

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "proto_bin.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "signaling.so"
loadmodule "sipmsgops.so"

loadmodule "clusterer.so"
modparam("clusterer", "db_mode", 0)
modparam("clusterer", "my_node_id", 1)
modparam("clusterer", "my_node_info",
	"cluster_id=1, url=bin:192.168.52.1:5566, priority=50, no_ping=1")

loadmodule "nats.so"
loadmodule "cachedb_nats.so"
modparam("cachedb_nats", "cachedb_url", "nats:loc://192.168.52.10:4222/")
modparam("cachedb_nats", "kv_bucket", "opensips")
/* a single-node test server */
modparam("cachedb_nats", "kv_replicas", 1)

loadmodule "usrloc.so"
modparam("usrloc", "cluster_mode", "full-sharing-cachedb")
modparam("usrloc", "location_cluster", 1)
modparam("usrloc", "cachedb_url", "nats:loc://192.168.52.10:4222/")
modparam("usrloc", "use_domain", 1)
loadmodule "registrar.so"

route {
	if (!is_method("REGISTER")) {
		sl_send_reply(503, "Service Unavailable");
		exit;
	}
	if (!save("location"))
		xlog("L_ERR", "save() failed for $tu\n");
	exit;
}
