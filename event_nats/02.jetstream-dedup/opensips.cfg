log_level=3
stderror_enabled=yes
udp_workers=2

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "signaling.so"
loadmodule "sipmsgops.so"

loadmodule "nats.so"
loadmodule "event_nats.so"
modparam("event_nats", "nats_url", "nats://192.168.52.10:4222")
modparam("event_nats", "jetstream", 1)

route {
	if (!is_method("REGISTER")) {
		sl_send_reply(503, "Service Unavailable");
		exit;
	}
	/* the Call-ID is the JetStream message id: a retransmitted or
	 * repeated REGISTER is stored once */
	if (!nats_publish("test.js.register", "from=$fU cseq=$cs", "$ci"))
		xlog("L_ERR", "nats_publish failed\n");
	sl_send_reply(200, "OK");
	exit;
}
