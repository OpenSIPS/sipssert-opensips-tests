---
# event_nats against a broker that requires a user and password: the
# credentials ride in nats_url (the password percent-encoded: S3cr@t) and
# the publish arrives.  The subscriber logs in with the same account.
timeout: 30

tasks:
  - name: NATS
    type: generic
    image: {{ nats_image }}
    ip: {{ nats_ip }}
    daemon: true
    stop_timeout: 2
    args: ["-js", "-m", "8222", "--user", "osips", "--pass", "S3cr@t"]
    healthcheck:
      test: "wget -q -O /dev/null http://127.0.0.1:8222/healthz"
      interval: 1000000000
      timeout: 1000000000
      retries: 30

  - name: Subscriber
    type: generic
    image: {{ natsbox_image }}
    ip: {{ natsbox_ip }}
    entrypoint: sh
    args: ["-c", "timeout 20 nats -s nats://{{ nats_ip }}:4222 --user osips --password 'S3cr@t' sub test.sip.register --count 1 --raw > /tmp/got; cat /tmp/got; grep -q 'method=REGISTER' /tmp/got"]
    require:
      healthy: NATS

  - name: OpenSIPS
    type: opensips
    require:
      healthy: NATS

  - name: Register
    type: uac-sipp
    username: {{ username }}
    config_file: sipp-register.xml
    require:
      - started:
          task: OpenSIPS
          wait: 3
      - started:
          task: Subscriber
          wait: 1
